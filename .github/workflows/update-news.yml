# Fetches the news on a schedule, commits data/ back to the repo (so the archive persists),
# and publishes the site to GitHub Pages.
name: Update news and deploy

on:
  schedule:
    - cron: '0 10 * * *'   # daily at 10:00 UTC
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Actions are pinned to exact commits so a moved tag can't change what runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Fetch feeds
        shell: pwsh
        run: ./update-news.ps1

      - name: Commit updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update news $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi

      # Publish only the site itself, not the scripts or config.
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html app.js data _site/

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
