<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Scripts may only come from this site, so feed text can never run as code. Images come from news publishers. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src https: data:; base-uri 'none'; form-action 'none'">
<title>The Daily Brief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf8f4; --surface: #ffffff; --text: #1a1a1a; --muted: #6b6b6b; --line: #e4e0d8;
    --accent: #b3261e; --chip: #f0ece4;
    --c-politics: #2f5d9e; --c-brazil: #8a6d00; --c-tech: #1f7a5a; --c-cybersecurity: #b3261e; --c-gaming: #7a3fb0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121212; --surface: #1c1c1c; --text: #ececec; --muted: #9a9a9a; --line: #2e2e2e;
      --accent: #ff6b5e; --chip: #262626;
      --c-politics: #7aa7ea; --c-brazil: #e6c449; --c-tech: #5fc79f; --c-cybersecurity: #ff7a6e; --c-gaming: #bb8ef0;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121212; --surface: #1c1c1c; --text: #ececec; --muted: #9a9a9a; --line: #2e2e2e;
    --accent: #ff6b5e; --chip: #262626;
    --c-politics: #7aa7ea; --c-brazil: #e6c449; --c-tech: #5fc79f; --c-cybersecurity: #ff7a6e; --c-gaming: #bb8ef0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 Inter, system-ui, sans-serif; }
  a { color: inherit; text-decoration: none; }
  a:hover h3, a:hover h2 { text-decoration: underline; text-underline-offset: 3px; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px; }

  header.masthead { border-bottom: 3px double var(--line); padding: 20px 0 12px; text-align: center; }
  .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  h1 { font-family: Fraunces, Georgia, serif; font-weight: 800; font-size: clamp(36px, 7vw, 64px); margin: 6px 0 2px; letter-spacing: -0.02em; }
  .tagline { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .12em; }

  nav.bar { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
  nav.bar .wrap { display: flex; gap: 8px; align-items: center; padding-top: 10px; padding-bottom: 10px; flex-wrap: wrap; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; }
  .tab { border: 0; background: transparent; color: var(--text); font: 600 14px Inter, sans-serif; padding: 7px 12px; border-radius: 999px; cursor: pointer; }
  .tab:hover { background: var(--chip); }
  .tab[aria-selected="true"] { background: var(--text); color: var(--bg); }
  .tools { display: flex; gap: 8px; align-items: center; }
  input[type=search], input[type=date] { font: 14px Inter, sans-serif; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text); }
  input[type=search] { width: 200px; max-width: 100%; }
  .icon-btn { border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 14px; }

  main { padding: 24px 0 48px; }
  .notice { background: var(--chip); border-left: 3px solid var(--accent); padding: 10px 14px; border-radius: 4px; margin-bottom: 20px; font-size: 14px; }
  section.cat { margin-bottom: 40px; }
  .cat-head { display: flex; justify-content: space-between; align-items: baseline; border-top: 2px solid var(--cat); padding-top: 8px; margin-bottom: 16px; }
  .cat-head h2 { font-family: Fraunces, Georgia, serif; font-size: 26px; margin: 0; color: var(--cat); }
  .cat-head button { border: 0; background: none; color: var(--muted); cursor: pointer; font: 500 13px Inter, sans-serif; }
  .cat-head button:hover { color: var(--text); }

  .front { display: grid; grid-template-columns: 1.4fr 1fr; gap: 24px; }
  .front > *, .grid > * { min-width: 0; }
  h3 { overflow-wrap: anywhere; }
  .lead img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 6px; background: var(--chip); }
  .lead h3 { font-family: Fraunces, Georgia, serif; font-size: 26px; line-height: 1.2; margin: 10px 0 6px; }
  .side { display: flex; flex-direction: column; }
  .side a { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .side a:first-child { padding-top: 0; }
  .side h3 { font-size: 16px; font-weight: 600; margin: 2px 0 0; line-height: 1.35; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
  .card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: var(--chip); }
  .card .body { padding: 12px 14px 14px; }
  .card h3 { font-size: 16px; line-height: 1.35; margin: 4px 0 6px; }
  .summary { color: var(--muted); font-size: 14px; margin: 0; }
  .byline { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .byline .src { color: var(--cat, var(--accent)); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }

  footer { border-top: 1px solid var(--line); padding: 16px 0 32px; font-size: 12px; color: var(--muted); }
  footer .bad { color: var(--accent); }

  @media (max-width: 760px) {
    .front { grid-template-columns: 1fr; }
    .tools { width: 100%; }
    input[type=search] { flex: 1; min-width: 0; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header class="masthead">
  <div class="wrap">
    <div class="meta-row"><span id="today"></span><span id="updated"></span></div>
    <h1>The Daily Brief</h1>
    <div class="tagline">Politics · Brazil · Tech · Cybersecurity · Gaming</div>
  </div>
</header>

<nav class="bar">
  <div class="wrap">
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="tools">
      <input type="search" id="q" placeholder="Search headlines…" aria-label="Search headlines">
      <input type="date" id="day" aria-label="Show archived day" title="Open an archived day">
      <button class="icon-btn" id="theme" title="Toggle dark mode" aria-label="Toggle dark mode">◐</button>
    </div>
  </div>
</nav>

<main class="wrap" id="main"></main>
<footer class="wrap" id="foot"></footer>

<script src="data/news.js"></script>
<script src="app.js"></script>
</body>
</html>
